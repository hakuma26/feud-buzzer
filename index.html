<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Friendly Feud - Live Buzzer</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- PeerJS WebRTC Library (CDN + Local Fallback) -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="this.onerror=null;this.src='assets/vendor/peerjs.min.js'"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --team-color: #ef4444;
            --team-color-dark: #991b1b;
            --gold: #f5c842;
            --navy-950: #040812;
            --navy-900: #08111f;
            --navy-800: #0e1c38;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--navy-950);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(30, 58, 138, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--team-color) 25%, transparent) 0%, transparent 70%),
                linear-gradient(180deg, #050b16 0%, #08111f 100%);
            color: #ffffff;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .buzzer-app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Top Header Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(8, 17, 31, 0.75);
            border: 1px solid rgba(245, 200, 66, 0.25);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .room-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .room-badge strong {
            color: var(--gold);
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            transition: all .25s ease;
        }

        .status-pill.connecting {
            background: rgba(245, 200, 66, 0.2);
            color: #fde047;
            border: 1px solid rgba(245, 200, 66, 0.4);
        }

        .status-pill.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .status-pill.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Team Showcase Area */
        .team-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 10px 0 6px 0;
            text-align: center;
            z-index: 5;
        }

        .team-avatar-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid var(--team-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            box-shadow: 0 0 25px var(--team-color), inset 0 2px 5px rgba(255, 255, 255, 0.2);
            animation: avatarFloat 4s ease-in-out infinite;
        }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .team-name-tag {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 20px var(--team-color);
            padding: 2px 16px;
            border-bottom: 2px solid var(--team-color);
        }

        /* Phase / Feedback Announcement Text */
        .phase-message {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            color: #94a3b8;
            min-height: 24px;
            margin-bottom: 6px;
            transition: color .2s ease;
        }

        /* GIANT 3D TOUCH BUZZER BUTTON */
        .buzzer-stage {
            flex: 1;
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 8px 0;
        }

        .btn-buzz {
            width: 100%;
            aspect-ratio: 1;
            max-height: 330px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            touch-action: manipulation;
            transition: all .15s cubic-bezier(.23, 1, .32, 1);
            user-select: none;
        }

        /* Outer ring housing */
        .btn-buzz::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.7) 100%);
            border: 3px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), inset 0 2px 6px rgba(255, 255, 255, 0.15);
            z-index: -1;
        }

        /* 1. DISARMED / WAITING STATE */
        .btn-buzz.disarmed {
            background: radial-gradient(circle at 35% 35%, #1e293b 0%, #0f172a 70%, #020617 100%);
            color: rgba(255, 255, 255, 0.35);
            border: 4px solid #334155;
            box-shadow: 0 12px 0 #020617, 0 16px 25px rgba(0, 0, 0, 0.7);
            font-size: 1.6rem;
            cursor: not-allowed;
        }

        /* 2. ARMED (ACTIVE TO BUZZ) STATE - PULSES WITH ENERGY */
        .btn-buzz.armed {
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--team-color) 45%, var(--team-color-dark) 100%);
            color: #ffffff;
            border: 4px solid #ffffff;
            font-size: 3.8rem;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            box-shadow:
                0 14px 0 var(--team-color-dark),
                0 20px 40px rgba(0, 0, 0, 0.8),
                0 0 60px var(--team-color),
                inset 0 4px 12px rgba(255, 255, 255, 0.6);
            animation: buzzerArmedPulse 1.1s ease-in-out infinite alternate;
            cursor: pointer;
        }

        .btn-buzz.armed:active {
            transform: translateY(10px);
            box-shadow:
                0 4px 0 var(--team-color-dark),
                0 6px 15px rgba(0, 0, 0, 0.9),
                0 0 80px var(--team-color),
                inset 0 2px 6px rgba(255, 255, 255, 0.8);
        }

        @keyframes buzzerArmedPulse {
            0% {
                transform: scale(0.98);
                filter: brightness(1);
            }
            100% {
                transform: scale(1.03);
                filter: brightness(1.22);
            }
        }

        /* 3. YOU BUZZED IN FIRST (WINNER) */
        .btn-buzz.winner {
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #22c55e 50%, #15803d 100%) !important;
            color: #ffffff !important;
            border: 4px solid #ffffff !important;
            font-size: 2.2rem !important;
            box-shadow:
                0 14px 0 #14532d,
                0 0 80px rgba(34, 197, 94, 0.85),
                inset 0 4px 12px rgba(255, 255, 255, 0.8) !important;
            animation: buzzWinnerPop .4s ease-out;
            cursor: not-allowed;
        }

        @keyframes buzzWinnerPop {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 4. LOCKED OUT (OPPONENT WAS FASTER) */
        .btn-buzz.locked {
            background: radial-gradient(circle at 40% 40%, #1e1b2e 0%, #0f0d1a 100%);
            color: #ef4444;
            border: 4px solid rgba(239, 68, 68, 0.4);
            font-size: 1.5rem;
            box-shadow: 0 8px 0 #000;
            animation: buzzLockedShake .4s ease;
            cursor: not-allowed;
        }

        @keyframes buzzLockedShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-14px); }
            40% { transform: translateX(14px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        /* Footer Guide */
        .bottom-bar {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 700;
            padding: 4px 8px;
            letter-spacing: 0.3px;
        }

        /* Haptic flash overlay */
        .screen-flash {
            position: fixed;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease;
            z-index: 1000;
        }
        .screen-flash.active {
            opacity: 0.45;
            transition: none;
        }
    </style>
</head>
<body>
    <div class="screen-flash" id="flash"></div>

    <div class="buzzer-app">
        <!-- TOP STATUS BAR -->
        <header class="top-bar">
            <div class="room-badge">
                <span>Room:</span>
                <strong id="display-room">----</strong>
            </div>
            <div class="status-pill connecting" id="display-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <!-- TEAM HEADER -->
        <div class="team-banner">
            <div class="team-avatar-box" id="display-avatar">🦁</div>
            <div class="team-name-tag" id="display-team-name">TEAM 1</div>
        </div>

        <!-- PHASE STATUS ANNOUNCEMENT -->
        <div class="phase-message" id="display-phase">Waiting for live round...</div>

        <!-- GIANT 3D BUZZER BUTTON -->
        <div class="buzzer-stage">
            <button class="btn-buzz disarmed" id="btn-buzz" disabled>
                <span id="btn-buzz-text">WAITING...</span>
            </button>
        </div>

        <!-- FOOTER INFO -->
        <footer class="bottom-bar">
            <span>Keep this screen open. Screen lock is disabled.</span>
        </footer>
    </div>

    <script>
        (function () {
            // URL Parameters Parsing
            const params = new URLSearchParams(window.location.search);
            const roomCode = (params.get('room') || '').toUpperCase().trim();
            const teamIndex = parseInt(params.get('team') || '0', 10);
            const teamName = (params.get('name') || (teamIndex === 0 ? 'TEAM 1' : 'TEAM 2')).toUpperCase();
            const teamColor = params.get('color') || (teamIndex === 0 ? '#ef4444' : '#3b82f6');
            const teamAvatar = params.get('avatar') || (teamIndex === 0 ? '🦁' : '🐺');

            // Apply Team Theme
            document.documentElement.style.setProperty('--team-color', teamColor);
            document.documentElement.style.setProperty('--team-color-dark', shadeColor(teamColor, -35));
            document.getElementById('display-room').textContent = roomCode || '????';
            document.getElementById('display-team-name').textContent = teamName;
            document.getElementById('display-avatar').textContent = teamAvatar;
            document.title = `Buzzer - ${teamName}`;

            // Elements
            const statusPill = document.getElementById('display-status');
            const statusText = document.getElementById('status-text');
            const phaseMsg = document.getElementById('display-phase');
            const buzzBtn = document.getElementById('btn-buzz');
            const buzzBtnText = document.getElementById('btn-buzz-text');
            const flashOverlay = document.getElementById('flash');

            // State
            let peer = null;
            let hostConn = null;
            let isArmed = false;
            let wakeLock = null;
            let reconnectTimer = null;
            let retryCount = 0;

            // Web Audio Synthesizer for instant in-phone sound
            let audioCtx = null;
            function playBuzzerTone(type) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    if (type === 'buzz') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.25);
                    } else if (type === 'armed') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(659, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.15);
                    }
                } catch (e) {}
            }

            // Screen WakeLock to keep phone awake
            async function enableWakeLock() {
                if ('wakeLock' in navigator && !wakeLock) {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => { wakeLock = null; });
                    } catch (e) {}
                }
            }

            // Haptic Vibration Helper
            function triggerVibration(pattern) {
                if (navigator.vibrate) {
                    try { navigator.vibrate(pattern); } catch (e) {}
                }
            }

            function setConnectionStatus(status, text) {
                statusPill.className = `status-pill ${status}`;
                statusText.textContent = text;
            }

            // ICE Servers Configuration for NAT & Carrier Traversal
            const rtcConfig = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun.cloudflare.com:3478' },
                    { urls: 'stun:stun.relay.metered.ca:80' },
                    {
                        urls: 'turn:global.relay.metered.ca:80',
                        username: 'ba88079176616565ef57f408',
                        credential: '2sorAbF4hI8eMjGO'
                    },
                    {
                        urls: 'turn:global.relay.metered.ca:443',
                        username: 'ba88079176616565ef57f408',
                        credential: '2sorAbF4hI8eMjGO'
                    }
                ]
            };

            // PeerJS Connection Management
            function connectToHost() {
                if (!roomCode) {
                    setConnectionStatus('error', 'Missing Code');
                    phaseMsg.textContent = 'Scan QR code or re-enter link with ?room=CODE';
                    return;
                }

                setConnectionStatus('connecting', 'Connecting...');
                phaseMsg.textContent = 'Contacting studio game host...';

                try {
                    if (peer) peer.destroy();
                } catch (e) {}

                peer = new Peer({ debug: 0, config: rtcConfig });

                peer.on('open', () => {
                    const hostPeerId = 'feud-' + roomCode;
                    hostConn = peer.connect(hostPeerId, { reliable: true });

                    hostConn.on('open', () => {
                        retryCount = 0;
                        setConnectionStatus('connected', 'Connected');
                        phaseMsg.textContent = 'Ready! Waiting for host...';

                        // Handshake with Host
                        hostConn.send({
                            type: 'hello',
                            team: teamIndex,
                            name: teamName,
                            avatar: teamAvatar,
                            color: teamColor
                        });
                        enableWakeLock();
                    });

                    hostConn.on('data', (data) => {
                        if (!data || typeof data !== 'object') return;

                        if (data.type === 'state') {
                            handleHostState(data);
                        }
                    });

                    hostConn.on('close', () => {
                        setConnectionStatus('connecting', 'Reconnecting...');
                        setBuzzerState('disarmed', 'STAND BY', 'Host disconnected. Reconnecting...');
                        scheduleReconnect();
                    });

                    hostConn.on('error', () => {
                        scheduleReconnect();
                    });
                });

                peer.on('disconnected', () => {
                    try { peer.reconnect(); } catch (e) { scheduleReconnect(); }
                });

                peer.on('error', (err) => {
                    setConnectionStatus('error', 'Network Error');
                    setBuzzerState('disarmed', 'STAND BY', 'Connection error. Retrying...');
                    scheduleReconnect();
                });
            }

            function scheduleReconnect() {
                if (reconnectTimer) return;
                retryCount++;
                const delay = Math.min(1000 * Math.pow(1.4, retryCount - 1), 5000);
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connectToHost();
                }, delay);
            }

            // State Handler
            function handleHostState(state) {
                if (state.armed) {
                    isArmed = true;
                    setBuzzerState('armed', 'BUZZ!', '⚡ BUZZERS ARE LIVE! TAP NOW! ⚡');
                    phaseMsg.style.color = '#fde047';
                    playBuzzerTone('armed');
                    triggerVibration([50, 30, 50]);
                } else if (state.winnerIdx !== null && state.winnerIdx !== undefined) {
                    isArmed = false;
                    if (state.winnerIdx === teamIndex) {
                        setBuzzerState('winner', 'BUZZED IN!', '🎯 YOU BUZZED IN FIRST! ANSWER NOW!');
                        phaseMsg.style.color = '#4ade80';
                        triggerVibration([120, 60, 120]);
                        triggerFlash();
                    } else {
                        const winnerName = (state.teams && state.teams[state.winnerIdx]) || 'OTHER TEAM';
                        setBuzzerState('locked', 'LOCKED OUT', `🔒 ${winnerName} BUZZED FIRST!`);
                        phaseMsg.style.color = '#ef4444';
                        triggerVibration([30, 40, 30]);
                    }
                } else {
                    isArmed = false;
                    setBuzzerState('disarmed', 'STAND BY', 'Waiting for next live round...');
                    phaseMsg.style.color = '#94a3b8';
                }
            }

            function setBuzzerState(mode, btnText, phaseText) {
                buzzBtn.className = `btn-buzz ${mode}`;
                buzzBtnText.textContent = btnText;
                buzzBtn.disabled = (mode !== 'armed');
                phaseMsg.textContent = phaseText;
            }

            function triggerFlash() {
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 300);
            }

            // Buzzer Tap Event (Optimized for low-latency touch)
            function handleBuzzTap(e) {
                if (e) e.preventDefault();
                enableWakeLock();

                if (isArmed && hostConn && hostConn.open) {
                    playBuzzerTone('buzz');
                    triggerVibration(80);
                    triggerFlash();

                    // Send Buzz with timestamp
                    hostConn.send({
                        type: 'buzz',
                        team: teamIndex,
                        timestamp: Date.now()
                    });

                    // Optimistic update
                    setBuzzerState('winner', 'BUZZED!', 'Sending buzz to studio...');
                } else {
                    triggerVibration([20, 30, 20]);
                }
            }

            buzzBtn.addEventListener('pointerdown', handleBuzzTap);
            buzzBtn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

            // Lifecycle Listeners
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    enableWakeLock();
                    if (!hostConn || !hostConn.open) connectToHost();
                }
            });
            window.addEventListener('online', () => connectToHost());

            // Helper for color shades
            function shadeColor(color, percent) {
                let R = parseInt(color.substring(1, 3), 16);
                let G = parseInt(color.substring(3, 5), 16);
                let B = parseInt(color.substring(5, 7), 16);
                R = parseInt(R * (100 + percent) / 100);
                G = parseInt(G * (100 + percent) / 100);
                B = parseInt(B * (100 + percent) / 100);
                R = (R < 255) ? R : 255;
                G = (G < 255) ? G : 255;
                B = (B < 255) ? B : 255;
                const RR = ((R.toString(16).length === 1) ? "0" + R.toString(16) : R.toString(16));
                const GG = ((G.toString(16).length === 1) ? "0" + G.toString(16) : G.toString(16));
                const BB = ((B.toString(16).length === 1) ? "0" + B.toString(16) : B.toString(16));
                return "#" + RR + GG + BB;
            }

            // Start Connection
            connectToHost();
            enableWakeLock();
        })();
    </script>
</body>
</html>
